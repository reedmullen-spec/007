# ============================================================================
# 007 watchlist — Tier 1 + high-concrete-fit Tier 2 general contractors.
#
# UK / Europe / US entries come from the Tier 1 & Tier 2 GC list, kept in the
# repo as data/gc_tiers_uk_eu_us_2026-08-22.csv and merged in by
# build_watchlist_from_gc_doc.py. That script is additive: it never rewrites
# an existing entry, because several names here are tuned queries rather than
# legal company names (see below). Canada and Australia are not in that
# document and were not touched.
#
# news.py auto-generates a Google News RSS query for EVERY entry here,
# combining the contractor name with the signal terms below (awarded /
# breaking ground / starting construction / concrete pour). One entry = one
# feed. Add a line to watch someone new; delete to drop them.
#
# Known projects are deliberately NOT tracked here — the watchlist exists to
# surface NEW awards and starts, not news about projects already in Notion.
#
# region controls the Slack channel + mentions:
#   uk | eu | us | us_east | us_west | ca | au
# us_east tags Jamie, us_west and ca tag Alex, us (national firms) tags both.
# North America deals still default to Reed as owner in HubSpot.
# hl/gl/ceid override the Google News locale when the region default is wrong.
#
# LOCALES ARE ENGLISH EVERYWHERE, ON PURPOSE. gl/ceid still target the country,
# but hl stays 'en'. Every feed is keyword-gated on English terms (rule 21), so
# a local-language headline can't pass — "VINCI remporte un contrat" carries no
# gate keyword. Measured 2026-08-22 over six major EU contractors: the
# local-language feeds returned 27 raw entries between them against 242 for the
# identical English query, and only the English ones produced a gate pass. Do
# not set hl back to a local language without also adding local-language gate
# keywords to config.yaml.
#
# Some names are deliberately NOT the legal company name — "Multiplex
# construction", "Careys construction", "RG Group construction", "NCC
# construction" carry a disambiguating word so the Google query doesn't drown
# in unrelated hits. The name is also stored as NewsItem.entity and seeds the
# '[Contractor] — ...' HubSpot deal name, so don't "correct" these.
# ============================================================================

# NOTE: the AND clause below is ADVISORY. Google News ranks by relevance and
# returns items matching none of the required phrases, so news.py gates these
# feeds on config.yaml news.gate_keywords like any other feed (rule 21).
# "when:7d" here does nothing either — tested 2026-08-22, identical results.
signal_query_template: >-
  "{entity}" AND ("awarded" OR "contract award" OR "breaking ground" OR
  "breaks ground" OR "starting construction" OR "construction begins" OR
  "start on site" OR "first concrete" OR "concrete pour" OR "pouring concrete")

