name: Diagnose GC capture

# One-off read-only diagnostic: GC/JV capture rate by source.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run diagnostic
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python diagnose_gc.py
