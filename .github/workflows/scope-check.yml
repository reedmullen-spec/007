name: Scope check

# One-off read-only diagnostic: scopes the Value-in-millions data issue
# across the whole database.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run check
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python scope_check.py
