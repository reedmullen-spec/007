name: Nightly sync

# Pulls AE-owned edits (Status, Next action, Next action date) from each
# person's "My week" page back to the master database. Never touches
# Notes/Outcome/Correction needed — those stay on the AE page; corrections
# are DM'd to Reed instead of being auto-applied.
on:
  schedule:
    - cron: "0 23 * * 1-5"   # weekdays 23:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print what would sync, change nothing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tender-radar-state
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run sync
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python sync.py --dry-run
          else
            python sync.py
          fi
      - name: Commit state
        if: always()
        run: |
          git config user.name  "tender-radar-bot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash || true
          git add state/
          git diff --staged --quiet || git commit -m "chore: update radar state [skip ci]"
          git push
