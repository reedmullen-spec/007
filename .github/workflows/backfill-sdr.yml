name: Backfill SDR

# One-off: sets SDR (derived from AE via routing.ae_sdr_map) on existing
# rows created before this field existed.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print what would change, change nothing)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run backfill
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python backfill_sdr.py --dry-run
          else
            python backfill_sdr.py
          fi
