name: Check value anomaly

# One-off read-only diagnostic: inspects stored Value/Currency/Source for
# named rows, to debug why some rows score "value below floor" when they
# shouldn't.
on:
  workflow_dispatch:
    inputs:
      names:
        description: "Comma-separated project name fragments to look up"
        type: string
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run check
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          IFS=',' read -ra NAMES <<< "${{ github.event.inputs.names }}"
          python check_value_anomaly.py "${NAMES[@]}"
