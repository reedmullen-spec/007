name: Cleanup filters

# One-off / repeatable: re-checks existing "New" rows against the current
# relevance filter and disqualifies the ones that no longer pass. Dispatch
# only — this isn't a scheduled job, it's run by hand after a filter change.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print what would be disqualified, change nothing)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run cleanup
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python cleanup_filters.py --dry-run
          else
            python cleanup_filters.py
          fi
