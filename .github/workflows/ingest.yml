name: Ingest projects

# V1: silently build the Notion project database. No Slack messages.
on:
  schedule:
    - cron: "0 2 * * 1-5"   # weekdays 02:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print candidates, write nothing)"
        type: boolean
        default: false
      days_back:
        description: "How many days back to scan"
        default: "2"

permissions:
  contents: write

concurrency:
  group: tender-radar-state
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run ingest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python ingest.py --dry-run --days-back "${{ github.event.inputs.days_back || '2' }}"
          else
            python ingest.py --days-back "${{ github.event.inputs.days_back || '2' }}"
          fi

      - name: Commit state
        if: always()
        run: |
          git config user.name  "tender-radar-bot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash || true
          git add state/
          git diff --staged --quiet || git commit -m "chore: update radar state [skip ci]"
          git push
