name: Monday triage

# Picks top-N New projects per region, marks them "This week", posts one
# Slack list per region with Notion links. Carry-over: unfinished
# "This week" rows stay listed and count toward the cap.
on:
  schedule:
    - cron: "0 6 * * 1"   # Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print picks, change nothing)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tender-radar-state
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run triage
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python triage.py --dry-run
          else
            python triage.py
          fi
      - name: Commit state
        if: always()
        run: |
          git config user.name  "tender-radar-bot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash || true
          git add state/
          git diff --staged --quiet || git commit -m "chore: update radar state [skip ci]"
          git push
