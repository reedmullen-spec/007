name: Cleanup news filters

# One-off / repeatable: re-checks existing "New" NEWS rows against the
# current news gate (news.gate_keywords / news.exclude_keywords) and
# disqualifies the ones that no longer pass. The sibling cleanup-filters.yml
# covers TED/FTS/AUSTENDER/SAM only — news rows go through a different gate
# entirely. Dispatch only: run by hand after a news-keyword change.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print what would be disqualified, change nothing)"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run cleanup
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python cleanup_news_filters.py --dry-run
          else
            python cleanup_news_filters.py
          fi
