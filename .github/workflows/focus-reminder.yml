name: Focus reminder

# Runs hourly every Friday; focus_reminder.py checks each person's local
# time (triage.lists[].timezone) and only messages the ones for whom
# it's currently ~4pm. Hourly + per-person zoneinfo, rather than one
# fixed UTC cron time, so it's correct for everyone's own local evening
# and survives DST changes without needing seasonal cron edits.
on:
  schedule:
    - cron: "0 * * * 5"   # every hour, Fridays only
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print who would be messaged, send nothing)"
        type: boolean
        default: false
      ignore_time:
        description: "Ignore the per-person local-time check (testing only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tender-radar-state
  cancel-in-progress: false

jobs:
  reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run focus reminder
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          args=""
          if [ "${{ github.event.inputs.ignore_time }}" = "true" ]; then
            args="--ignore-time"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python focus_reminder.py --dry-run $args
          else
            python focus_reminder.py $args
          fi
      - name: Commit state
        if: always()
        run: |
          git config user.name  "tender-radar-bot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash || true
          git add state/
          git diff --staged --quiet || git commit -m "chore: update radar state [skip ci]"
          git push
