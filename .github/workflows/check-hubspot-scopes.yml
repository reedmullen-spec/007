name: Check HubSpot scopes

# Answers "did crm.objects.notes.read get added yet?" — see
# check_hubspot_scopes.py. Read-only, so it is safe to run any time.
# HUBSPOT_TOKEN is an Actions secret, which is why this can't be a laptop
# one-liner.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Check scopes
        env:
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: python check_hubspot_scopes.py
